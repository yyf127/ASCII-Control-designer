<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII UI 设计器 — 仿 VB6 控件设计</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
  --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --danger:#b62324;
  --cw:9px; --chh:17px;
}
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:13px; }
.app { display:flex; flex-direction:column; height:100vh; }
.toolbar { display:flex; align-items:center; gap:10px; padding:8px 14px;
  background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
.toolbar h1 { font-size:14px; font-weight:600; letter-spacing:.5px; color:var(--text); margin-right:8px; }
.toolbar h1 span { color:var(--accent); }
.toolbar .spacer { flex:1; }
button.tb { background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit;
  transition:.12s; white-space:nowrap; }
button.tb:hover { background:#262c36; border-color:#484f58; }
button.tb:active { transform:translateY(1px); }
button.tb.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
button.tb.danger:hover { background:#d12a2b; border-color:#d12a2b; }
.body { flex:1; display:flex; overflow:hidden; }
.toolbox { width:156px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  overflow-y:auto; padding:8px 0; }
.tb-title { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); padding:6px 12px 8px; }
.tool-item { display:flex; align-items:center; gap:9px; padding:7px 12px; cursor:pointer;
  user-select:none; border-left:3px solid transparent; font-size:12px; transition:.1s; }
.tool-item:hover { background:#1f2630; }
.tool-item.active { background:rgba(88,166,255,.12); border-left-color:var(--accent); color:var(--accent); }
.tool-item .ico { width:20px; text-align:center; font-family:Consolas,monospace; font-size:14px; color:var(--dim); }
.tool-item.active .ico { color:var(--accent); }
.stage { flex:1; overflow:auto; padding:22px;
  background:radial-gradient(circle at 50% 0%, #131a24 0%, #0d1117 70%); }
.canvas { position:relative; margin:0 auto; background-color:#0a0d12;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size:var(--cw) var(--chh);
  box-shadow:0 0 0 1px #21262d, 0 12px 40px rgba(0,0,0,.6);
  outline:none; cursor:crosshair;
  font-family:"Cascadia Mono", Consolas, "DejaVu Sans Mono", "Courier New", monospace;
  font-size:13px; line-height:var(--chh); }
.cell { position:absolute; width:var(--cw); height:var(--chh); text-align:center;
  white-space:pre; pointer-events:none; line-height:var(--chh); }
.cell.wide { width:calc(var(--cw) * 2); }
.props { width:248px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; }
.prop-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
  border-bottom:1px solid var(--border); font-size:12px; position:sticky; top:0;
  background:var(--panel); z-index:2; }
.prop-type { color:var(--accent); font-weight:600; }
.prop-id { color:var(--dim); font-size:11px; }
.prop-row { display:flex; flex-direction:column; gap:4px; padding:7px 12px; border-bottom:1px solid #1f242c; }
.prop-row label { font-size:11px; color:var(--dim); }
.prop-row input[type=text], .prop-row input[type=number], .prop-row textarea, .prop-row select {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:5px 8px; border-radius:5px; font-family:inherit; font-size:12px; outline:none; resize:vertical; }
.prop-row input:focus, .prop-row textarea:focus, .prop-row select:focus {
  border-color:var(--accent); box-shadow:0 0 0 2px rgba(88,166,255,.15); }
.prop-row input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
.prop-empty { padding:40px 20px; text-align:center; color:var(--dim); font-size:12px; line-height:2; }
.prop-empty span { font-size:11px; color:#545d68; }
.statusbar { height:26px; flex-shrink:0; display:flex; align-items:center; gap:18px; padding:0 14px;
  background:var(--panel); border-top:1px solid var(--border); font-size:11px; color:var(--dim);
  font-family:Consolas, monospace; }
.statusbar .hint { margin-left:auto; color:#545d68; }
.statusbar .flash { color:#7ee787; }
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:10px;
  width:min(900px,90vw); max-height:80vh; display:flex; flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.7); }
.modal h2 { font-size:13px; padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; }
.modal textarea { flex:1; min-height:300px; background:#0a0d12; border:none; outline:none;
  color:#c9d1d9; font-family:Consolas, "Cascadia Mono", monospace; font-size:13px; line-height:1.35;
  padding:14px 16px; resize:none; white-space:pre; overflow:auto; }
.modal-foot { display:flex; gap:10px; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--border); }
</style>
</head>
<body>

<div class="app">
  <div class="toolbar">
    <h1>ASCII UI <span>设计器</span></h1>
    <button class="tb" id="btnExport">导出 ASCII</button>
    <button class="tb" id="btnClear">清空画布</button>
    <button class="tb" id="btnUndo" style="display:none">撤销清空</button>
    <div class="spacer"></div>
    <button class="tb" id="btnHelp">快捷键</button>
  </div>

  <div class="body">
    <div class="toolbox" id="toolbox"></div>
    <div class="stage">
      <div class="canvas" id="canvas" tabindex="0"></div>
    </div>
    <div class="props" id="props"></div>
  </div>

  <div class="statusbar">
    <span id="stPos">X: 0  Y: 0</span>
    <span id="stTool">工具: 选择</span>
    <span id="stCount">控件: 0</span>
    <span class="hint">Alt+点击选中容器 · 层级树与 SmartArt 独立控件</span>
  </div>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   常量与工具
   ========================================================= */
const COLS = 160, ROWS = 80;
const CW = 9, CH = 17;
const PX_W = COLS * CW, PX_H = ROWS * CH;

const canvasEl = document.getElementById('canvas');
const toolboxEl = document.getElementById('toolbox');
const propsEl  = document.getElementById('props');
const stPos    = document.getElementById('stPos');
const stTool   = document.getElementById('stTool');
const stCount  = document.getElementById('stCount');

let flashTimer = null;
function flashStatus(msg) {
  clearTimeout(flashTimer);
  stCount.textContent = msg;
  stCount.classList.add('flash');
  flashTimer = setTimeout(() => {
    stCount.classList.remove('flash');
    updateStatus();
  }, 2500);
}

function charWidth(ch) {
  const c = ch.codePointAt(0);
  return ((c >= 0x1100 && c <= 0x115F) || c === 0x2329 || c === 0x232A ||
    (c >= 0x2E80 && c <= 0xA4CF && c !== 0x303F) || (c >= 0xAC00 && c <= 0xD7A3) ||
    (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFE30 && c <= 0xFE6F) ||
    (c >= 0xFF00 && c <= 0xFF60) || (c >= 0xFFE0 && c <= 0xFFE6) ||
    (c >= 0x20000 && c <= 0x3FFFD)) ? 2 : 1;
}
function strWidth(s) { let w = 0; for (const ch of s) w += charWidth(ch); return w; }
function truncate(text, maxW) {
  if (maxW <= 0) return '';
  let w = 0, out = '';
  for (const ch of text) { const cw = charWidth(ch); if (w + cw > maxW) break; out += ch; w += cw; }
  return out;
}
function escHtml(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function parseItems(text) {
  return String(text || '').split('\n').map(s => s.replace(/^\s+|\s+$/g, '')).filter(Boolean);
}

/* =========================================================
   颜色 / 网格绘制基础
   ========================================================= */
const C = { border:'#7d8fa1', text:'#c9d1d9', dim:'#6e7681', thumb:'#8b949e', accent:'#58a6ff', title:'#a8b3c0' };
const S = {
  border:{fg:C.border}, text:{fg:C.text}, dim:{fg:C.dim},
  thumb:{fg:C.thumb}, title:{fg:C.title}, accent:{fg:C.accent}
};

let grid = [];
function clearGrid() {
  grid = [];
  for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(null));
}
function put(x, y, ch, style) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
  if (ch === undefined || ch === null) return;
  const w = charWidth(ch);
  grid[y][x] = { ch, fg: style && style.fg, bg: style && style.bg, wide: w === 2 };
  if (w === 2 && x + 1 < COLS) grid[y][x + 1] = { skip: true };
}
function putText(x, y, text, style) {
  let cx = x;
  for (const ch of text) {
    if (ch === '\n' || ch === '\r') continue;
    put(cx, y, ch, style);
    cx += charWidth(ch);
  }
  return cx;
}
function drawCentered(x, y, w, text, style) {
  const tw = strWidth(text);
  const start = x + Math.max(0, Math.floor((w - tw) / 2));
  putText(start, y, text, style);
}
function drawRight(x, y, w, text, style) {
  const tw = strWidth(text);
  putText(x + Math.max(0, w - tw), y, text, style);
}
function box(x, y, w, h, style, ch) {
  if (w < 1 || h < 1) return;
  const o = Object.assign({ tl:'┌', tr:'┐', bl:'└', br:'┘', hz:'─', vt:'│' }, ch || {});
  if (w === 1 && h === 1) { put(x, y, '·', style); return; }
  if (h === 1) { for (let i = 0; i < w; i++) put(x + i, y, o.hz, style); return; }
  if (w === 1) { for (let j = 0; j < h; j++) put(x, y + j, o.vt, style); return; }
  put(x, y, o.tl, style); put(x + w - 1, y, o.tr, style);
  put(x, y + h - 1, o.bl, style); put(x + w - 1, y + h - 1, o.br, style);
  for (let i = 1; i < w - 1; i++) { put(x + i, y, o.hz, style); put(x + i, y + h - 1, o.hz, style); }
  for (let j = 1; j < h - 1; j++) { put(x, y + j, o.vt, style); put(x + w - 1, y + j, o.vt, style); }
}
function pickLineChar(up, down, left, right) {
  if (up && down && left && right) return '┼';
  if (up && down && left) return '┤';
  if (up && down && right) return '├';
  if (up && down) return '│';
  if (up && left && right) return '┴';
  if (down && left && right) return '┬';
  if (up && left) return '┘';
  if (up && right) return '└';
  if (down && left) return '┐';
  if (down && right) return '┌';
  if (left && right) return '─';
  if (up || down) return '│';
  if (left || right) return '─';
  return '─';
}

/* =========================================================
   层级树
   ========================================================= */
const TREE_STYLES = {
  unicode: { name:'Unicode 框线', branch:'├─ ', last:'└─ ', pipe:'│  ', blank:'   ' },
  ascii:   { name:'ASCII 兼容',  branch:'+- ', last:'\\- ', pipe:'|  ', blank:'   ' },
  dot:     { name:'圆点',        branch:'• ',  last:'• ',  pipe:'  ',  blank:'  ' },
  plain:   { name:'纯缩进（无符号）', branch:'', last:'', pipe:'', blank:'  ' }
};

function drawTree(c) {
  const style = TREE_STYLES[c.TreeStyle] || TREE_STYLES.unicode;
  const rawLines = String(c.Items || '').split('\n');
  const nodes = [];
  for (const line of rawLines) {
    if (!line.trim()) continue;
    const expanded = line.replace(/\t/g, '  ');
    const m = expanded.match(/^( *)(.*)$/);
    nodes.push({ indent: m[1].length, text: m[2] });
  }
  if (!nodes.length) return;
  const uniq = [...new Set(nodes.map(n => n.indent))].sort((a, b) => a - b);
  const depthMap = new Map();
  uniq.forEach((v, i) => depthMap.set(v, i));
  const depths = nodes.map(n => depthMap.get(n.indent));
  for (let i = 0; i < nodes.length && i < c.h; i++) {
    const d = depths[i];
    let prefix = '';
    for (let j = 0; j < d; j++) {
      if (j === d - 1) {
        let isLast = true;
        for (let k = i + 1; k < nodes.length; k++) {
          if (depths[k] < d) break;
          if (depths[k] === d) { isLast = false; break; }
        }
        prefix += isLast ? style.last : style.branch;
      } else {
        let hasMore = false;
        for (let k = i + 1; k < nodes.length; k++) {
          if (depths[k] <= j) break;
          if (depths[k] === j + 1) { hasMore = true; break; }
        }
        prefix += hasMore ? style.pipe : style.blank;
      }
    }
    putText(c.x, c.y + i, truncate(prefix + nodes[i].text, c.w), S.text);
  }
}

/* =========================================================
   循环 — 水平 / 垂直
   ========================================================= */
function drawCycleH(c) {
  const items = parseItems(c.Items);
  const n = items.length;
  if (!n) return;

  if (n === 1) {
    const boxH = Math.min(5, c.h);
    const boxY = c.y + Math.floor((c.h - boxH) / 2);
    box(c.x, boxY, c.w, boxH, S.border);
    drawCentered(c.x + 1, boxY + Math.floor(boxH / 2), c.w - 2, truncate(items[0], c.w - 2), S.text);
    return;
  }

  let gap = 3;
  let boxW = Math.floor((c.w - (n - 1) * gap) / n);
  if (boxW < 8) { gap = 2; boxW = Math.floor((c.w - (n - 1) * gap) / n); }
  if (boxW < 6) { gap = 1; boxW = Math.max(4, Math.floor((c.w - (n - 1) * gap) / n)); }

  const boxH = Math.min(5, Math.max(3, c.h - 2));
  const totalW = n * boxW + (n - 1) * gap;
  const startX = c.x + Math.max(0, Math.floor((c.w - totalW) / 2));

  const needH = boxH + 2;
  const topY = c.h >= needH
    ? c.y + Math.floor((c.h - needH) / 2)
    : c.y;

  const boxes = [];
  for (let i = 0; i < n; i++) {
    boxes.push({
      x: startX + i * (boxW + gap),
      y: topY, w: boxW, h: boxH,
      text: items[i]
    });
  }

  const midY = topY + Math.floor(boxH / 2);

  // 水平箭头
  for (let i = 0; i < n - 1; i++) {
    const b1 = boxes[i];
    const x1 = b1.x + b1.w;
    if (gap >= 2) putText(x1, midY, '─▶', S.border);
    else put(x1, midY, '▶', S.border);
  }

  // 底部回环
  const c1x = boxes[0].x + Math.floor(boxes[0].w / 2);
  const cNx = boxes[n - 1].x + Math.floor(boxes[n - 1].w / 2);
  const arrowY = topY + boxH;
  const loopY = topY + boxH + 1;

  if (arrowY < c.y + c.h) put(c1x, arrowY, '▲', S.border);
  if (loopY < c.y + c.h) {
    put(c1x, loopY, '└', S.border);
    for (let x = c1x + 1; x < cNx; x++) put(x, loopY, '─', S.border);
    put(cNx, loopY, '┘', S.border);
    if (arrowY < loopY) put(cNx, arrowY, '│', S.border);
  }

  for (const b of boxes) {
    box(b.x, b.y, b.w, b.h, S.border);
    drawCentered(b.x + 1, b.y + Math.floor(b.h / 2), b.w - 2, truncate(b.text, b.w - 2), S.text);
  }
}

function drawCycleV(c) {
  const items = parseItems(c.Items);
  const n = items.length;
  if (!n) return;

  if (n === 1) {
    const boxH = Math.min(5, c.h);
    const boxY = c.y + Math.floor((c.h - boxH) / 2);
    box(c.x, boxY, c.w, boxH, S.border);
    drawCentered(c.x + 1, boxY + Math.floor(boxH / 2), c.w - 2, truncate(items[0], c.w - 2), S.text);
    return;
  }

  const minBoxH = 3, minGap = 1;
  const idealH = n * minBoxH + (n - 1) * minGap;
  let boxH, gapH;
  if (c.h >= idealH) {
    boxH = minBoxH;
    const extra = c.h - idealH;
    gapH = minGap + Math.floor(extra / (n - 1));
  } else {
    gapH = minGap;
    boxH = Math.max(1, Math.floor((c.h - (n - 1) * gapH) / n));
    if (boxH < 1) { boxH = 1; gapH = 0; }
  }

  const totalH = n * boxH + (n - 1) * gapH;
  const startY = c.y + Math.max(0, Math.floor((c.h - totalH) / 2));

  const loopSpace = 5;
  const boxW = Math.max(6, Math.min(c.w - loopSpace, 22));
  const boxX = c.x;

  const boxes = [];
  for (let i = 0; i < n; i++) {
    boxes.push({
      x: boxX,
      y: startY + i * (boxH + gapH),
      w: boxW, h: boxH,
      text: items[i]
    });
  }

  // 相邻框之间的 ▼ 连接
  for (let i = 0; i < n - 1; i++) {
    const b1 = boxes[i], b2 = boxes[i + 1];
    const cx = b1.x + Math.floor(b1.w / 2);
    const y1 = b1.y + b1.h;
    const y2 = b2.y;
    const space = y2 - y1;
    if (space <= 0) continue;
    if (space === 1) {
      put(cx, y1, '▼', S.border);
    } else {
      for (let k = 0; k < space - 1; k++) put(cx, y1 + k, '│', S.border);
      put(cx, y2 - 1, '▼', S.border);
    }
  }

  // 右侧回环
  const loopX = boxX + boxW + 2;
  if (loopX < c.x + c.w) {
    const cy1 = boxes[0].y + Math.floor(boxes[0].h / 2);
    const cyN = boxes[n - 1].y + Math.floor(boxes[n - 1].h / 2);

    for (let x = boxX + boxW; x < loopX; x++) put(x, cyN, '─', S.border);
    put(loopX, cyN, '┘', S.border);
    for (let y = cy1 + 1; y < cyN; y++) put(loopX, y, '│', S.border);
    put(loopX, cy1, '┐', S.border);
    for (let x = boxX + boxW + 1; x < loopX; x++) put(x, cy1, '─', S.border);
    put(boxX + boxW, cy1, '◀', S.border);
  }

  for (const b of boxes) {
    box(b.x, b.y, b.w, b.h, S.border);
    drawCentered(b.x + 1, b.y + Math.floor(b.h / 2), b.w - 2, truncate(b.text, b.w - 2), S.text);
  }
}

/* =========================================================
   层次结构 — 5 个方向
   ========================================================= */
function drawHierarchyDown(c) {
  const items = parseItems(c.Items);
  if (!items.length) return;
  const root = items[0], children = items.slice(1);
  const n = Math.max(1, children.length);
  const rootH = Math.min(3, c.h);
  const rootW = Math.min(c.w, Math.max(6, Math.min(16, Math.floor(c.w / 2))));
  const rootX = c.x + Math.floor((c.w - rootW) / 2);
  const rootCx = rootX + Math.floor(rootW / 2);
  box(rootX, c.y, rootW, rootH, S.border);
  drawCentered(rootX + 1, c.y + Math.floor(rootH / 2), rootW - 2, truncate(root, rootW - 2), S.text);
  if (!children.length) return;
  const branchY = c.y + rootH, arrowY = branchY + 1, childY = arrowY + 1;
  const childH = Math.min(Math.max(1, c.y + c.h - childY), 3);
  if (childH < 1 || branchY >= c.y + c.h) return;
  if (rootH >= 2 && rootCx > rootX && rootCx < rootX + rootW - 1)
    put(rootCx, c.y + rootH - 1, '┬', S.border);
  const gap = 1;
  const childW = Math.max(4, Math.floor((c.w - (n - 1) * gap) / n));
  const totalW = n * childW + (n - 1) * gap;
  const cx0 = c.x + Math.floor((c.w - totalW) / 2);
  const childCxs = [];
  for (let i = 0; i < n; i++) childCxs.push(cx0 + i * (childW + gap) + Math.floor(childW / 2));
  const allCx = [...childCxs, rootCx];
  const minX = Math.min(...allCx), maxX = Math.max(...allCx);
  for (let x = minX; x <= maxX; x++) put(x, branchY, '─', S.border);
  for (const cx of allCx)
    put(cx, branchY, pickLineChar(cx === rootCx, childCxs.includes(cx), cx > minX, cx < maxX), S.border);
  if (arrowY < c.y + c.h) for (const cx of childCxs) put(cx, arrowY, '▼', S.border);
  for (let i = 0; i < n; i++) {
    const x = cx0 + i * (childW + gap);
    box(x, childY, childW, childH, S.border);
    drawCentered(x + 1, childY + Math.floor(childH / 2), childW - 2, truncate(children[i], childW - 2), S.text);
  }
}

function drawHierarchyUp(c) {
  const items = parseItems(c.Items);
  if (!items.length) return;
  const root = items[0], children = items.slice(1);
  const n = Math.max(1, children.length);
  const childH = Math.min(3, c.h);
  const gap = 1;
  const childW = Math.max(4, Math.floor((c.w - (n - 1) * gap) / n));
  const totalW = n * childW + (n - 1) * gap;
  const cx0 = c.x + Math.floor((c.w - totalW) / 2);
  const childCxs = [];
  for (let i = 0; i < n; i++) childCxs.push(cx0 + i * (childW + gap) + Math.floor(childW / 2));
  for (let i = 0; i < n; i++) {
    const x = cx0 + i * (childW + gap);
    box(x, c.y, childW, childH, S.border);
    drawCentered(x + 1, c.y + Math.floor(childH / 2), childW - 2, truncate(children[i], childW - 2), S.text);
  }
  const rootH = Math.min(3, c.h);
  const rootW = Math.min(c.w, Math.max(6, Math.min(16, Math.floor(c.w / 2))));
  const rootX = c.x + Math.floor((c.w - rootW) / 2);
  const rootCx = rootX + Math.floor(rootW / 2);
  const rootY = c.y + c.h - rootH;
  box(rootX, rootY, rootW, rootH, S.border);
  drawCentered(rootX + 1, rootY + Math.floor(rootH / 2), rootW - 2, truncate(root, rootW - 2), S.text);
  if (!children.length) return;
  if (childH >= 2) {
    for (let i = 0; i < n; i++) {
      const x = cx0 + i * (childW + gap);
      const cx = x + Math.floor(childW / 2);
      if (cx > x && cx < x + childW - 1) put(cx, c.y + childH - 1, '┴', S.border);
    }
  }
  const branchY = rootY - 2, arrowY = rootY - 1;
  if (branchY <= c.y + childH) {
    for (let y = c.y + childH; y < rootY - 1; y++) put(rootCx, y, '│', S.border);
    put(rootCx, rootY - 1, '▼', S.border);
    if (rootH >= 2 && rootCx > rootX && rootCx < rootX + rootW - 1) put(rootCx, rootY, '┬', S.border);
    return;
  }
  for (const cx of childCxs) for (let y = c.y + childH; y < branchY; y++) put(cx, y, '│', S.border);
  const allCx = [...childCxs, rootCx];
  const minX = Math.min(...allCx), maxX = Math.max(...allCx);
  for (let x = minX; x <= maxX; x++) put(x, branchY, '─', S.border);
  for (const cx of allCx)
    put(cx, branchY, pickLineChar(childCxs.includes(cx), cx === rootCx, cx > minX, cx < maxX), S.border);
  for (let y = branchY + 1; y < rootY - 1; y++) put(rootCx, y, '│', S.border);
  if (arrowY >= branchY + 1) put(rootCx, arrowY, '▼', S.border);
  if (rootH >= 2 && rootCx > rootX && rootCx < rootX + rootW - 1) put(rootCx, rootY, '┬', S.border);
}

function drawHierarchyRight(c) {
  const items = parseItems(c.Items);
  if (!items.length) return;
  const root = items[0], children = items.slice(1);
  const n = Math.max(1, children.length);
  const rootW = Math.min(14, Math.max(6, Math.floor(c.w * 0.3)));
  const rootH = Math.min(3, c.h);
  const rootX = c.x;
  const rootY = c.y + Math.floor((c.h - rootH) / 2);
  const rootCy = rootY + Math.floor(rootH / 2);
  const rootRight = rootX + rootW;
  box(rootX, rootY, rootW, rootH, S.border);
  drawCentered(rootX + 1, rootCy, rootW - 2, truncate(root, rootW - 2), S.text);
  if (!children.length) return;
  const childW = Math.min(16, Math.max(6, Math.floor(c.w * 0.4)));
  const childH = Math.min(3, Math.max(1, Math.floor(c.h / n) - 1));
  const childX = c.x + c.w - childW;
  const totalH = n * childH;
  const gapTotal = c.h - totalH;
  const gapPer = n > 1 ? Math.max(0, Math.floor(gapTotal / (n - 1))) : 0;
  const childYs = [];
  let yy = c.y;
  for (let i = 0; i < n; i++) { childYs.push(yy); yy += childH + (i < n - 1 ? gapPer : 0); }
  const childCys = childYs.map(y => y + Math.floor(childH / 2));
  const trunkX = rootRight + Math.max(2, Math.floor((childX - rootRight) / 2));
  if (rootH >= 2 && rootCy > rootY && rootCy < rootY + rootH - 1) put(rootRight - 1, rootCy, '├', S.border);
  for (let x = rootRight; x < trunkX; x++) put(x, rootCy, '─', S.border);
  const allYs = [rootCy, ...childCys];
  const minY = Math.min(...allYs), maxY = Math.max(...allYs);
  const childCySet = new Set(childCys);
  for (let y = minY; y <= maxY; y++)
    put(trunkX, y, pickLineChar(y > minY, y < maxY, y === rootCy, childCySet.has(y)), S.border);
  for (let i = 0; i < n; i++) {
    const cy = childCys[i], cyTop = childYs[i];
    box(childX, cyTop, childW, childH, S.border);
    drawCentered(childX + 1, cy, childW - 2, truncate(children[i], childW - 2), S.text);
    if (childH >= 2 && cy > cyTop && cy < cyTop + childH - 1) put(childX, cy, '┤', S.border);
    for (let x = trunkX + 1; x < childX - 1; x++) put(x, cy, '─', S.border);
    put(childX - 1, cy, '▶', S.border);
  }
}

function drawHierarchyLeft(c) {
  const items = parseItems(c.Items);
  if (!items.length) return;
  const root = items[0], children = items.slice(1);
  const n = Math.max(1, children.length);
  const rootW = Math.min(14, Math.max(6, Math.floor(c.w * 0.3)));
  const rootH = Math.min(3, c.h);
  const rootX = c.x + c.w - rootW;
  const rootY = c.y + Math.floor((c.h - rootH) / 2);
  const rootCy = rootY + Math.floor(rootH / 2);
  const rootLeft = rootX;
  box(rootX, rootY, rootW, rootH, S.border);
  drawCentered(rootX + 1, rootCy, rootW - 2, truncate(root, rootW - 2), S.text);
  if (!children.length) return;
  const childW = Math.min(16, Math.max(6, Math.floor(c.w * 0.4)));
  const childH = Math.min(3, Math.max(1, Math.floor(c.h / n) - 1));
  const childX = c.x;
  const childRight = childX + childW;
  const totalH = n * childH;
  const gapTotal = c.h - totalH;
  const gapPer = n > 1 ? Math.max(0, Math.floor(gapTotal / (n - 1))) : 0;
  const childYs = [];
  let yy = c.y;
  for (let i = 0; i < n; i++) { childYs.push(yy); yy += childH + (i < n - 1 ? gapPer : 0); }
  const childCys = childYs.map(y => y + Math.floor(childH / 2));
  const trunkX = childRight + Math.max(2, Math.floor((rootLeft - childRight) / 2));
  if (rootH >= 2 && rootCy > rootY && rootCy < rootY + rootH - 1) put(rootX, rootCy, '├', S.border);
  for (let x = trunkX + 1; x < rootLeft; x++) put(x, rootCy, '─', S.border);
  const allYs = [rootCy, ...childCys];
  const minY = Math.min(...allYs), maxY = Math.max(...allYs);
  const childCySet = new Set(childCys);
  for (let y = minY; y <= maxY; y++)
    put(trunkX, y, pickLineChar(y > minY, y < maxY, childCySet.has(y), y === rootCy), S.border);
  for (let i = 0; i < n; i++) {
    const cy = childCys[i], cyTop = childYs[i];
    box(childX, cyTop, childW, childH, S.border);
    drawCentered(childX + 1, cy, childW - 2, truncate(children[i], childW - 2), S.text);
    if (childH >= 2 && cy > cyTop && cy < cyTop + childH - 1) put(childRight - 1, cy, '┤', S.border);
    for (let x = childRight + 1; x < trunkX; x++) put(x, cy, '─', S.border);
    put(childRight, cy, '◀', S.border);
  }
}

function drawHierarchyMiddle(c) {
  const items = parseItems(c.Items);
  if (items.length < 2) {
    if (items.length === 1) {
      const boxH = Math.min(3, c.h);
      box(c.x, c.y, c.w, boxH, S.border);
      drawCentered(c.x + 1, c.y + Math.floor(boxH / 2), c.w - 2, truncate(items[0], c.w - 2), S.text);
    }
    return;
  }

  const top = items[0];
  const bottom = items[items.length - 1];
  const mids = items.slice(1, items.length - 1);
  const n = mids.length;
  if (n === 0) return;

  const boxH = 3;
  const topY = c.y;
  const botY = c.y + c.h - boxH;
  const midY = c.y + Math.floor((c.h - boxH) / 2);

  const topW = Math.min(16, Math.max(6, Math.floor(c.w / 2)));
  const topX = c.x + Math.floor((c.w - topW) / 2);
  const topCx = topX + Math.floor(topW / 2);

  const botW = topW;
  const botX = topX;
  const botCx = topCx;

  const gap = 2;
  const midW = Math.max(4, Math.floor((c.w - (n - 1) * gap) / n));
  const totalW = n * midW + (n - 1) * gap;
  const midStartX = c.x + Math.floor((c.w - totalW) / 2);

  const midBoxes = [];
  for (let i = 0; i < n; i++) {
    const x = midStartX + i * (midW + gap);
    midBoxes.push({
      x, y: midY, w: midW, h: boxH,
      cx: x + Math.floor(midW / 2),
      text: mids[i]
    });
  }

  // 上方连接
  const topBranchY = topY + boxH;
  const topArrowY  = midY - 1;
  if (topBranchY < midY - 1) {
    const allCx = [topCx, ...midBoxes.map(b => b.cx)];
    const minX = Math.min(...allCx), maxX = Math.max(...allCx);
    for (let x = minX; x <= maxX; x++) put(x, topBranchY, '─', S.border);
    for (const cxx of allCx)
      put(cxx, topBranchY, pickLineChar(cxx === topCx, midBoxes.some(b => b.cx === cxx), cxx > minX, cxx < maxX), S.border);
    for (const b of midBoxes) {
      for (let y = topBranchY + 1; y < topArrowY; y++) put(b.cx, y, '│', S.border);
      put(b.cx, topArrowY, '▼', S.border);
    }
  }

  // 下方连接
  const botBranchY = botY - 2;
  const botArrowY  = botY - 1;
  if (botBranchY > midY + boxH) {
    for (const b of midBoxes)
      for (let y = b.y + b.h; y < botBranchY; y++) put(b.cx, y, '│', S.border);
    const allCx = [botCx, ...midBoxes.map(b => b.cx)];
    const minX = Math.min(...allCx), maxX = Math.max(...allCx);
    for (let x = minX; x <= maxX; x++) put(x, botBranchY, '─', S.border);
    for (const cxx of allCx)
      put(cxx, botBranchY, pickLineChar(midBoxes.some(b => b.cx === cxx), cxx === botCx, cxx > minX, cxx < maxX), S.border);
    for (let y = botBranchY + 1; y < botArrowY; y++) put(botCx, y, '│', S.border);
    put(botCx, botArrowY, '▼', S.border);
  }

  // 画框
  box(topX, topY, topW, boxH, S.border);
  drawCentered(topX + 1, topY + Math.floor(boxH / 2), topW - 2, truncate(top, topW - 2), S.text);
  box(botX, botY, botW, boxH, S.border);
  drawCentered(botX + 1, botY + Math.floor(boxH / 2), botW - 2, truncate(bottom, botW - 2), S.text);
  for (const b of midBoxes) {
    box(b.x, b.y, b.w, b.h, S.border);
    drawCentered(b.x + 1, b.y + Math.floor(b.h / 2), b.w - 2, truncate(b.text, b.w - 2), S.text);
  }

  // 修连接点
  if (topBranchY < midY - 1 && boxH >= 2)
    put(topCx, topY + boxH - 1, '┬', S.border);
  if (botBranchY > midY + boxH && boxH >= 2) {
    for (const b of midBoxes) put(b.cx, b.y + b.h - 1, '┴', S.border);
    put(botCx, botY, '┬', S.border);
  }
}

                const txt = truncate(items[i], Math.max(4, Math.floor(step) - 2));
                const tw = strWidth(txt);
                const tx = Math.max(c.x, Math.min(c.x + c.w - tw, x - Math.floor(tw / 2)));
                putText(tx, ty, txt, S.text);
              }
            } else {
              for (let k = 1; k <= lineH; k++) put(x, midY + k, '│', S.border);
              const ty = midY + lineH + 1;
              if (ty < c.y + c.h) {
                const txt = truncate(items[i], Math.max(4, Math.floor(step) - 2));
                const tw = strWidth(txt);
                const tx = Math.max(c.x, Math.min(c.x + c.w - tw, x - Math.floor(tw / 2)));
                putText(tx, ty, txt, S.text);
              }
            }
          }
        }
      },
      vertical: { name: '垂直时间线', hint: '一条竖轴，节点左右交替标注',
        draw(c) {
          const items = parseItems(c.Items);
          const n = items.length;
          if (!n) return;
          const midX = c.x + Math.floor(c.w / 2);
          for (let y = c.y; y < c.y + c.h; y++) put(midX, y, '│', S.border);
          put(midX, c.y, '┬', S.border);
          put(midX, c.y + c.h - 1, '┴', S.border);
          const step = c.h / (n + 1);
          for (let i = 0; i < n; i++) {
            const y = Math.round(c.y + step * (i + 1));
            if (y <= c.y || y >= c.y + c.h - 1) continue;
            const isLeft = i % 2 === 0;
            put(midX, y, '●', S.accent);
            const maxTxtW = Math.max(4, Math.floor(c.w / 2) - 3);
            const txt = truncate(items[i], maxTxtW);
            const tw = strWidth(txt);
            if (isLeft) {
              put(midX - 1, y, '─', S.border);
              const tx = Math.max(c.x, midX - 2 - tw);
              putText(tx, y, txt, S.text);
            } else {
              put(midX + 1, y, '─', S.border);
              const tx = Math.min(c.x + c.w - tw, midX + 2);
              putText(tx, y, txt, S.text);
            }
          }
        }
      }
    }
  }
};

/* =========================================================
   控件类型
   ========================================================= */
function makeSmartArtType(categoryKey) {
  const cat = SMARTART_CATEGORIES[categoryKey];
  const firstTpl = Object.keys(cat.templates)[0];
  return {
    name: 'SmartArt ' + cat.name,
    shortName: cat.name,
    icon: cat.icon,
    category: categoryKey,
    def: { w: cat.defW, h: cat.defH, Template: firstTpl, Items: cat.defItems },
    props: ['Name', 'Template', 'Items'],
    draw(c) {
      const tpl = cat.templates[c.Template] || cat.templates[firstTpl];
      try { tpl.draw(c); } catch (e) {}
    }
  };
}

  X: { label: 'X 坐标', type: 'number' },
  Y: { label: 'Y 坐标', type: 'number' },
  W: { label: '宽度 (Width)', type: 'number' },

/* =========================================================
   状态
   ========================================================= */
let controls = [];
let selectedId = null;
let activeTool = null;
let nextId = 1;
let drag = null;
let clipboard = null;
let clearedSnapshot = null;

/* =========================================================
   容器辅助
   ========================================================= */
function isContainer(c) { return c.type === 'Frame'; }
function isChildOf(child, parent) {
  if (child === parent) return false;
  if (parent.type !== 'Frame') return false;
  return child.x >= parent.x + 1 && child.y >= parent.y + 1 &&
         child.x + child.w <= parent.x + parent.w - 1 &&
         child.y + child.h <= parent.y + parent.h - 1;
}
function collectDescendants(frame) {
  const result = [], seen = new Set();
  function walk(f) {
    for (const c of controls) {
      if (c === f || seen.has(c.id)) continue;
      if (isChildOf(c, f)) {
        seen.add(c.id); result.push(c);
        if (c.type === 'Frame') walk(c);
      }
    }
  }
  walk(frame);
  return result;
}
function getSelected() { return controls.find(c => c.id === selectedId) || null; }

function autoName(type) {
  const baseMap = {
    CommandButton:'Command', Label:'Label', TextBox:'Text', CheckBox:'Check',
    OptionButton:'Option', Frame:'Frame', ComboBox:'Combo', ListBox:'List',
    HScrollBar:'HScroll', VScrollBar:'VScroll', PictureBox:'Picture', Timer:'Timer',
    TreeView:'Tree', SmartArtList:'List', SmartArtProcess:'Proc',
    SmartArtCycle:'Cycle', SmartArtHierarchy:'Hier', SmartArtTimeline:'Time'
  };
  const base = baseMap[type] || 'Control';
  const used = new Set(controls.map(c => c.Name));
  let n = 1;
  while (used.has(base + n)) n++;
  return base + n;
}

function createControl(type, x, y, w, h) {
  const def = TYPES[type];
  const name = autoName(type);
  const c = Object.assign({}, def.def, {
    id: nextId++, type,
    x: Math.max(0, Math.min(COLS - 1, Math.round(x))),
    y: Math.max(0, Math.min(ROWS - 1, Math.round(y))),
    w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)),
    Name: name
  });
  if ('Caption' in c && /1$/.test(c.Caption)) c.Caption = name;
  c.w = Math.min(c.w, COLS - c.x);
  c.h = Math.min(c.h, ROWS - c.y);
  controls.push(c);
  selectedId = c.id;
  return c;
}

function deleteSelected() {
  const c = getSelected();
  if (!c) return;
  const toDelete = new Set([c.id]);
  if (isContainer(c)) for (const d of collectDescendants(c)) toDelete.add(d.id);
  for (let i = controls.length - 1; i >= 0; i--)
    if (toDelete.has(controls[i].id)) controls.splice(i, 1);
  selectedId = null;
  renderAll();
}

/* =========================================================
   渲染
   ========================================================= */
function renderGrid() {
  clearGrid();
  for (const c of controls) {
    const def = TYPES[c.type];
    if (def && def.draw) { try { def.draw(c); } catch (e) {} }
  }
  if (drag && drag.mode === 'create') {
    const x0 = Math.min(drag.x0, drag.x1), y0 = Math.min(drag.y0, drag.y1);
    const x1 = Math.max(drag.x0, drag.x1), y1 = Math.max(drag.y0, drag.y1);
    box(x0, y0, x1 - x0 + 1, y1 - y0 + 1, S.accent,
        { tl:'┌', tr:'┐', bl:'└', br:'┘', hz:'┄', vt:'┆' });
  }
  const sel = getSelected();
  if (sel) markSelection(sel);
  const parts = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = grid[y][x];
      if (!cell || cell.skip) continue;
      const hasChar = cell.ch && cell.ch !== ' ';
      const hasBg = !!cell.bg;
      const isSel = !!cell.sel;
      if (!hasChar && !hasBg && !isSel) continue;
      let style = `left:${x * CW}px;top:${y * CH}px;`;
      if (cell.wide) style += `width:${CW * 2}px;`;
      if (cell.fg) style += `color:${cell.fg};`;
      if (cell.bg) style += `background:${cell.bg};`;
      if (isSel) style += `background:${cell.bg ? cell.bg : '#1f6feb'};color:#fff;`;
      const cls = cell.wide ? 'cell wide' : 'cell';
      parts.push(`<div class="${cls}" style="${style}">${escHtml(cell.ch || ' ')}</div>`);
    }
  }
  canvasEl.innerHTML = parts.join('');
}

function markSelection(c) {
  const mark = (x, y) => {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    if (!grid[y][x]) grid[y][x] = { ch: ' ' };
    if (grid[y][x].skip) return;
    grid[y][x].sel = true;
  };
  for (let i = 0; i < c.w; i++) { mark(c.x + i, c.y); mark(c.x + i, c.y + c.h - 1); }
  for (let j = 1; j < c.h - 1; j++) { mark(c.x, c.y + j); mark(c.x + c.w - 1, c.y + j); }
}

function renderAll() { renderGrid(); renderProps(); updateStatus(); }
function updateStatus() {
  stCount.textContent = '控件: ' + controls.length;
  stTool.textContent = '工具: ' + (activeTool ? TYPES[activeTool].name : '选择');
}

/* =========================================================
   工具箱
   ========================================================= */
function buildToolbox() {
  const items = [
    `<div class="tb-title">控件工具箱</div>`,
    `<div class="tool-item" data-tool=""><span class="ico">▲</span><span>选择指针</span></div>`
  ];
  const isSmartArt = k => k.startsWith('SmartArt');
  const basicTypes = Object.keys(TYPES).filter(k => !isSmartArt(k));
  for (const key of basicTypes) {
    const t = TYPES[key];
    items.push(`<div class="tool-item" data-tool="${key}"><span class="ico">${t.icon}</span><span>${t.name}</span></div>`);
  }
  items.push(`<div class="tb-title" style="margin-top:6px">SmartArt</div>`);
  const smartKeys = Object.keys(TYPES).filter(isSmartArt);
  for (const key of smartKeys) {
    const t = TYPES[key];
    items.push(`<div class="tool-item" data-tool="${key}"><span class="ico">${t.icon}</span><span>${t.name}</span></div>`);
  }
  toolboxEl.innerHTML = items.join('');
  setActiveTool(null);
  toolboxEl.addEventListener('click', e => {
    const item = e.target.closest('.tool-item');
    if (!item) return;
    const tool = item.dataset.tool || null;
    setActiveTool(tool);
    canvasEl.focus();
  });
}
function setActiveTool(tool) {
  activeTool = tool;
  toolboxEl.querySelectorAll('.tool-item').forEach(el => {
    el.classList.toggle('active', (el.dataset.tool || null) === tool);
  });
  canvasEl.style.cursor = tool ? 'crosshair' : 'default';
  updateStatus();
}

/* =========================================================
   属性面板
   ========================================================= */
function getProp(c, key) {
  if (key === 'X') return c.x;
  if (key === 'Y') return c.y;
  if (key === 'W') return c.w;
  if (key === 'H') return c.h;
  return c[key];
}
function setProp(c, key, val) {
  if (key === 'X' || key === 'Y') {
    const oldVal = key === 'X' ? c.x : c.y;
    let newVal;
    if (key === 'X') {
      newVal = Math.max(0, Math.min(COLS - c.w, Math.round(+val) || 0));
      c.x = newVal;
    } else {
      newVal = Math.max(0, Math.min(ROWS - c.h, Math.round(+val) || 0));
      c.y = newVal;
    }
    const delta = newVal - oldVal;
    if (delta !== 0 && isContainer(c)) {
      for (const d of collectDescendants(c)) {
        if (key === 'X') d.x = Math.max(0, Math.min(COLS - d.w, d.x + delta));
        else             d.y = Math.max(0, Math.min(ROWS - d.h, d.y + delta));
      }
    }
    return;
  }
  if (key === 'W') { c.w = Math.max(1, Math.min(COLS - c.x, Math.round(+val) || 1)); return; }
  if (key === 'H') { c.h = Math.max(1, Math.min(ROWS - c.y, Math.round(+val) || 1)); return; }
  c[key] = val;
}

function renderProps() {
  const c = getSelected();
  if (!c) {
    propsEl.innerHTML = `<div class="prop-empty">未选中控件<br><span>在画布上点击控件以编辑属性</span></div>`;
    return;
  }
  const def = TYPES[c.type];
  const keys = ['X', 'Y', 'W', 'H', ...def.props];
  let html = `<div class="prop-head"><span class="prop-type">${def.icon} ${def.name}</span><span class="prop-id">#${c.id}</span></div>`;
  if (isContainer(c)) {
    const n = collectDescendants(c).length;
    html += `<div class="prop-row"><label>子控件数量</label><span style="color:#8b949e;font-size:12px">${n} 个</span></div>`;
  }
  for (const key of keys) {
    const pd = PROP_DEFS[key];
    if (!pd) continue;
    const val = getProp(c, key);
    html += `<div class="prop-row"><label>${pd.label}</label>`;
    if (pd.type === 'bool') html += `<input type="checkbox" data-prop="${key}" ${val ? 'checked' : ''}>`;
    else if (pd.type === 'textarea') html += `<textarea data-prop="${key}" rows="8">${escHtml(val ?? '')}</textarea>`;
    else if (pd.type === 'select') {
      html += `<select data-prop="${key}">`;
      for (const [v, lbl] of pd.options) html += `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${lbl}</option>`;
      html += `</select>`;
    } else if (pd.type === 'dynamic-select') {
      const opts = pd.getOptions(c);
      html += `<select data-prop="${key}">`;
      for (const [v, lbl] of opts) html += `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${lbl}</option>`;
      html += `</select>`;
    } else if (pd.type === 'number') html += `<input type="number" data-prop="${key}" value="${val ?? 0}">`;
    else html += `<input type="text" data-prop="${key}" value="${escHtml(val ?? '')}">`;
    html += `</div>`;
  }
  if (def.category) {
    const cat = SMARTART_CATEGORIES[def.category];
    const tpl = cat && cat.templates[c.Template];
    if (tpl && tpl.hint) html += `<div class="prop-row" style="padding-top:8px"><label style="color:#58a6ff">💡 ${tpl.hint}</label></div>`;
  } else if (c.type === 'TreeView') {
    html += `<div class="prop-row" style="padding-top:8px"><label style="color:#58a6ff">💡 每行一个节点，前导空格表示层级</label></div>`;
  }
  propsEl.innerHTML = html;
}

propsEl.addEventListener('input', e => {
  const key = e.target.dataset.prop;
  if (!key) return;
  const c = getSelected();
  if (!c) return;
  let val;
  if (e.target.type === 'checkbox') val = e.target.checked;
  else if (e.target.type === 'number') val = parseInt(e.target.value, 10) || 0;
  else val = e.target.value;
  setProp(c, key, val);
  renderGrid();
  updateStatus();
});
propsEl.addEventListener('change', e => {
  if (e.target.tagName === 'SELECT') {
    const key = e.target.dataset.prop;
    const c = getSelected();
    if (c && key) { setProp(c, key, e.target.value); renderGrid(); renderProps(); }
  }
});

/* =========================================================
   画布交互
   ========================================================= */
function toGrid(e) {
  const r = canvasEl.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) / CW),
    y: Math.floor((e.clientY - r.top) / CH)
  };
}

function hitTest(x, y, opts) {
  opts = opts || {};
  const hits = [];
  for (let i = controls.length - 1; i >= 0; i--) {
    const c = controls[i];
    if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) hits.push(c);
  }
  if (!hits.length) return null;
  const deepest = list => list.reduce((best, c) => (c.w * c.h < best.w * best.h ? c : best), list[0]);
  if (opts.preferContainer) {
    const frames = hits.filter(isContainer);
    if (frames.length) return deepest(frames);
    return hits[0];
  }
  const nonContainers = hits.filter(c => !isContainer(c));
  if (nonContainers.length) return deepest(nonContainers);
  return deepest(hits);
}

canvasEl.addEventListener('mousedown', e => {
  e.preventDefault(); canvasEl.focus();
  const p = toGrid(e);
  if (activeTool) {
    drag = { mode: 'create', x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    renderGrid();
    return;
  }
  const hit = hitTest(p.x, p.y, { preferContainer: e.altKey });
  if (hit) {
    selectedId = hit.id;
    const isHandle = (p.x >= hit.x + hit.w - 2) && (p.y >= hit.y + hit.h - 2) && (hit.w > 2 || hit.h > 2);
    drag = {
      mode: isHandle ? 'resize' : 'move', id: hit.id,
      sx: p.x, sy: p.y, ox: hit.x, oy: hit.y, ow: hit.w, oh: hit.h, children: []
    };
    if (isContainer(hit) && drag.mode === 'move') {
      for (const d of collectDescendants(hit))
        drag.children.push({ id: d.id, dx: d.x - hit.x, dy: d.y - hit.y, w: d.w, h: d.h });
    }
  } else { selectedId = null; drag = null; }
  renderAll();
});

document.addEventListener('mousemove', e => {
  const r = canvasEl.getBoundingClientRect();
  const gx = Math.floor((e.clientX - r.left) / CW);
  const gy = Math.floor((e.clientY - r.top) / CH);
  if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS)
    stPos.textContent = `X: ${String(gx).padStart(2, ' ')}  Y: ${String(gy).padStart(2, ' ')}`;
  if (!drag) return;
  const p = toGrid(e);
  if (drag.mode === 'create') {
    drag.x1 = Math.max(0, Math.min(COLS - 1, p.x));
    drag.y1 = Math.max(0, Math.min(ROWS - 1, p.y));
    renderGrid();
    return;
  }
  const c = controls.find(x => x.id === drag.id);
  if (!c) return;
  if (drag.mode === 'move') {
    let nx = drag.ox + (p.x - drag.sx), ny = drag.oy + (p.y - drag.sy);
    let minX = 0, maxX = COLS - c.w, minY = 0, maxY = ROWS - c.h;
    for (const ch of drag.children) {
      minX = Math.max(minX, -ch.dx);
      maxX = Math.min(maxX, COLS - ch.w - ch.dx);
      minY = Math.max(minY, -ch.dy);
      maxY = Math.min(maxY, ROWS - ch.h - ch.dy);
    }
    nx = Math.max(minX, Math.min(maxX, nx));
    ny = Math.max(minY, Math.min(maxY, ny));
    const dx = nx - c.x, dy = ny - c.y;
    c.x = nx; c.y = ny;
    for (const ch of drag.children) {
      const child = controls.find(x => x.id === ch.id);
      if (child) { child.x += dx; child.y += dy; }
    }
  } else if (drag.mode === 'resize') {
    const nw = drag.ow + (p.x - drag.sx);
    const nh = drag.oh + (p.y - drag.sy);
    c.w = Math.max(1, Math.min(COLS - c.x, nw));
    c.h = Math.max(1, Math.min(ROWS - c.y, nh));
  }
  renderGrid();
});

document.addEventListener('mouseup', () => {
  if (!drag) return;
  if (drag.mode === 'create') {
    const x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
    const w = Math.abs(drag.x1 - drag.x0) + 1, h = Math.abs(drag.y1 - drag.y0) + 1;
    const def = TYPES[activeTool].def;
    const single = (w <= 1 && h <= 1);
    createControl(activeTool, x, y, single ? def.w : w, single ? def.h : h);
    setActiveTool(null);
  }
  drag = null;
  renderAll();
});

/* =========================================================
   键盘操作
   ========================================================= */
canvasEl.addEventListener('keydown', e => {
  const c = getSelected();
  if (e.key === 'Delete' || e.key === 'Backspace') { if (c) { e.preventDefault(); deleteSelected(); } return; }
  if (e.key === 'Escape') {
    if (activeTool) setActiveTool(null);
    else { selectedId = null; renderAll(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
    if (c) { clipboard = JSON.parse(JSON.stringify(c)); e.preventDefault(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
    if (clipboard) {
      e.preventDefault();
      const nc = JSON.parse(JSON.stringify(clipboard));
      nc.id = nextId++;
      nc.x = Math.min(COLS - nc.w, nc.x + 2);
      nc.y = Math.min(ROWS - nc.h, nc.y + 2);
      nc.Name = autoName(nc.type);
      if (nc.Caption) nc.Caption = nc.Name;
      controls.push(nc);
      selectedId = nc.id;
      renderAll();
    }
    return;
  }
  const arrows = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
  if (arrows[e.key] && c) {
    e.preventDefault();
    const [dx, dy] = arrows[e.key];
    const followers = (isContainer(c) && !e.shiftKey) ? collectDescendants(c) : [];
    if (e.shiftKey) {
      if (dx) c.w = Math.max(1, Math.min(COLS - c.x, c.w + dx));
      if (dy) c.h = Math.max(1, Math.min(ROWS - c.y, c.h + dy));
    } else {
      const oldX = c.x, oldY = c.y;
      c.x = Math.max(0, Math.min(COLS - c.w, c.x + dx));
      c.y = Math.max(0, Math.min(ROWS - c.h, c.y + dy));
      const ddx = c.x - oldX, ddy = c.y - oldY;
      for (const d of followers) {
        d.x = Math.max(0, Math.min(COLS - d.w, d.x + ddx));
        d.y = Math.max(0, Math.min(ROWS - d.h, d.y + ddy));
      }
    }
    renderAll();
  }
});

/* =========================================================
   导出
   ========================================================= */
function exportASCII() {
  const saved = selectedId, savedDrag = drag;
  selectedId = null; drag = null;
  clearGrid();
  for (const c of controls) {
    const def = TYPES[c.type];
    if (def && def.draw) def.draw(c);
  }
  const lines = [];
  for (let y = 0; y < ROWS; y++) {
    let line = '';
    for (let x = 0; x < COLS; x++) {
      const cell = grid[y][x];
      if (cell && cell.skip) continue;
      line += (cell && cell.ch) ? cell.ch : ' ';
    }
    lines.push(line.replace(/\s+$/, ''));
  }
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  selectedId = saved; drag = savedDrag;
  renderAll();
  return lines.join('\n');
}

function showModal(title, content) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal"><h2>${title}</h2><textarea readonly>${escHtml(content)}</textarea><div class="modal-foot"><button class="tb" data-act="copy">复制到剪贴板</button><button class="tb" data-act="close">关闭</button></div></div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', async e => {
    if (e.target === mask || e.target.dataset.act === 'close') { mask.remove(); canvasEl.focus(); return; }
    if (e.target.dataset.act === 'copy') {
      const ta = mask.querySelector('textarea');
      try {
        await navigator.clipboard.writeText(ta.value);
        e.target.textContent = '已复制 ✓';
        setTimeout(() => { e.target.textContent = '复制到剪贴板'; }, 1200);
      } catch (err) { ta.select(); document.execCommand('copy'); }
    }
  });
}

/* =========================================================
   顶栏按钮
   ========================================================= */
document.getElementById('btnExport').addEventListener('click', () => {
  const txt = exportASCII();
  if (!txt.trim()) { flashStatus('画布是空的'); return; }
  showModal('导出 ASCII 艺术', txt);
});

const btnClear = document.getElementById('btnClear');
const btnUndo  = document.getElementById('btnUndo');
let clearArmed = false, clearTimer = null;
function resetClearButton() {
  clearArmed = false; clearTimeout(clearTimer);
  btnClear.textContent = '清空画布'; btnClear.classList.remove('danger');
}
btnClear.addEventListener('click', () => {
  if (!controls.length) { flashStatus('画布已经是空的'); return; }
  if (!clearArmed) {
    clearArmed = true;
    btnClear.textContent = '再点一次确认清空';
    btnClear.classList.add('danger');
    clearTimer = setTimeout(resetClearButton, 3000);
    return;
  }
  resetClearButton();
  const n = controls.length;
  clearedSnapshot = JSON.parse(JSON.stringify(controls));
  controls.length = 0;
  selectedId = null; drag = null;
  renderAll();
  flashStatus(`已清空 ${n} 个控件`);
  btnUndo.style.display = '';
});
btnUndo.addEventListener('click', () => {
  if (!clearedSnapshot) return;
  const n = clearedSnapshot.length;
  for (const c of clearedSnapshot) {
    controls.push(c);
    if (c.id >= nextId) nextId = c.id + 1;
  }
  clearedSnapshot = null;
  btnUndo.style.display = 'none';
  renderAll();
  flashStatus(`已恢复 ${n} 个控件`);
});
